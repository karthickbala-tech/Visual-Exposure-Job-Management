<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar user block options</title>
<style>
	@font-face { font-family: Raleway; src: local('Raleway'); }
	:root { --side: #42484d; --brand: #68b04d; --on-brand: #f6f7f5; --ink: #1b1b1e; --danger: #ed1c24; }
	* { box-sizing: border-box; }
	body { margin: 0; padding: 24px; font-family: Raleway, system-ui, sans-serif; background: #f6f7f5; color: var(--ink); }
	h1 { margin: 0 0 4px; font-size: 22px; text-transform: uppercase; }
	p.note { margin: 0 0 20px; color: #5f6368; font-size: 13px; max-width: 70ch; }
	.row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
	figure { margin: 0; width: 260px; }
	figcaption { margin-top: 10px; font-size: 13px; line-height: 1.4; }
	figcaption b { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
	.side { height: 250px; display: flex; flex-direction: column; justify-content: flex-end; background: var(--side); color: #fff; position: relative; }
	.side.narrow { width: 76px; }
	.user { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); position: relative; }
	.avatar { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 13px; }
	.who { display: flex; flex-direction: column; flex: 1; min-width: 0; }
	.who strong { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.who span { font-size: 11.5px; color: #b6b8ba; text-transform: capitalize; }
	.who .role-green { color: #9bd47f; font-weight: 700; }
	button { font: inherit; color: inherit; cursor: pointer; }
	.sq { flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 1px solid rgba(255,255,255,.28); border-radius: 4px; background: transparent; color: #fff; }
	.sq:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.5); }
	.sq svg, .txt svg { width: 18px; height: 18px; }
	/* 1: clearer button with tooltip and red hover */
	.o1 .sq { width: 40px; height: 40px; position: relative; }
	.o1 .sq:hover { background: rgba(237,28,36,.18); border-color: #ff9c94; color: #ffb4ae; }
	.o1 .sq::after, .o4 .sq::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); right: 0; padding: 4px 8px; background: #111; color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; border-radius: 2px; opacity: 0; transform: translateY(3px); transition: opacity .12s ease-out, transform .12s ease-out; pointer-events: none; }
	.o1 .sq:hover::after, .o1 .sq:focus-visible::after, .o4 .sq:hover::after, .o4 .sq:focus-visible::after { opacity: 1; transform: none; }
	.sq:focus-visible, .txt:focus-visible, .menu-trigger:focus-visible, .menu button:focus-visible { outline: 2px solid #9bd47f; outline-offset: 2px; }
	/* 2: whole block opens a menu */
	.menu-trigger { display: flex; align-items: center; gap: 10px; width: 100%; padding: 0; border: 0; background: transparent; text-align: left; }
	.menu-trigger:hover .who strong { text-decoration: underline; }
	.chev { width: 16px; height: 16px; color: #b6b8ba; transition: transform .15s ease-out; }
	.menu-trigger[aria-expanded='true'] .chev { transform: rotate(180deg); }
	.menu { position: absolute; left: 10px; right: 10px; bottom: calc(100% - 4px); background: #2f3438; border: 1px solid rgba(255,255,255,.14); border-radius: 3px; padding: 6px; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
	.menu.open { display: block; }
	.menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: transparent; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-align: left; border-radius: 2px; }
	.menu button:hover { background: rgba(255,255,255,.1); }
	.menu button.out { color: #ff9c94; }
	.menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.12); margin: 4px 0; }
	.menu svg { width: 16px; height: 16px; }
	/* 3 and 4: text sign-out */
	.txt { display: inline-flex; align-items: center; gap: 6px; padding: 0; margin-top: 3px; border: 0; background: transparent; color: #ff9c94; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
	.txt:hover { text-decoration: underline; }
	.o4 .labelled { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid rgba(255,255,255,.28); border-radius: 4px; background: transparent; color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
	.o4 .labelled:hover { background: rgba(237,28,36,.18); border-color: #ff9c94; color: #ffb4ae; }
	.o4 .labelled svg { width: 16px; height: 16px; }
	.o4 .narrow .user { flex-direction: column; padding: 12px 0; }
	.o4 .narrow .who { display: none; }
	.o4 .narrow .labelled { padding: 0; width: 36px; justify-content: center; position: relative; }
	.o4 .narrow .labelled span { display: none; }
	.o4 .narrow .labelled::after { content: attr(data-tip); position: absolute; left: calc(100% + 8px); bottom: 6px; padding: 4px 8px; background: #111; color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; border-radius: 2px; opacity: 0; transition: opacity .12s ease-out; pointer-events: none; z-index: 3; }
	.o4 .narrow .labelled:hover::after, .o4 .narrow .labelled:focus-visible::after { opacity: 1; }
	.pair { display: flex; gap: 12px; align-items: flex-end; }
	@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<h1>Sidebar user block and sign-out options</h1>
<p class="note">Hover, tab to and click each one. Option 2 opens a menu when you click the name. Option 4 shows a wide and a narrow version (the narrow one is what a phone or collapsed sidebar would show).</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<symbol id="out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
	<symbol id="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></symbol>
	<symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
	<symbol id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
</svg>

<div class="row">
	<figure class="o0"><div class="side"><div class="user"><span class="avatar">KB</span><div class="who"><strong>Karthick Bala</strong><span>admin</span></div><button class="sq" aria-label="Sign out"><svg><use href="#out"/></svg></button></div></div>
		<figcaption><b>Today</b>Icon-only square button. No label, no tooltip.</figcaption></figure>

	<figure class="o1"><div class="side"><div class="user"><span class="avatar">KB</span><div class="who"><strong>Karthick Bala</strong><span>admin</span></div><button class="sq" data-tip="Sign out" aria-label="Sign out"><svg><use href="#out"/></svg></button></div></div>
		<figcaption><b>1. Clearer button</b>Same layout, bigger target, tooltip "Sign out", turns red on hover.</figcaption></figure>

	<figure class="o2"><div class="side"><div class="user" id="u2"><div class="menu" id="m2" role="menu"><button role="menuitem"><svg><use href="#user"/></svg> Profile</button><button role="menuitem"><svg><use href="#moon"/></svg> Dark theme</button><hr><button role="menuitem" class="out"><svg><use href="#out"/></svg> Sign out</button></div><button class="menu-trigger" id="t2" aria-haspopup="menu" aria-expanded="false"><span class="avatar">KB</span><span class="who"><strong>Karthick Bala</strong><span class="role-green">Admin</span></span><svg class="chev"><use href="#chev"/></svg></button></div></div>
		<figcaption><b>2. User menu</b>Click the name. Sign out lives in a small menu with Profile and Theme.</figcaption></figure>

	<figure class="o3"><div class="side"><div class="user"><span class="avatar">KB</span><div class="who"><strong>Karthick Bala</strong><span class="role-green">Admin</span><button class="txt"><svg style="width:13px;height:13px"><use href="#out"/></svg> Sign out</button></div></div></div>
		<figcaption><b>3. Text under the name</b>A plain "Sign out" link. Names the action, nothing to guess.</figcaption></figure>

	<figure class="o4"><div class="pair"><div class="side" style="width:260px"><div class="user"><span class="avatar">KB</span><div class="who"><strong>Karthick Bala</strong><span class="role-green">Admin</span></div><button class="labelled" data-tip="Sign out"><svg><use href="#out"/></svg><span>Sign out</span></button></div></div>
		<div class="side narrow"><div class="user"><span class="avatar">KB</span><button class="labelled" data-tip="Sign out" aria-label="Sign out"><svg><use href="#out"/></svg><span>Sign out</span></button></div></div></div>
		<figcaption><b>4. Icon plus label</b>Wide: icon and "Sign out". Narrow: icon only with a tooltip.</figcaption></figure>
</div>
<script>
	const t = document.getElementById('t2'), m = document.getElementById('m2');
	const set = (open) => { m.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open)); };
	t.addEventListener('click', () => set(!m.classList.contains('open')));
	document.addEventListener('click', (e) => { if (!document.getElementById('u2').contains(e.target)) set(false); });
	document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { set(false); t.focus(); } });
</script>
</body>
</html>
